{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>स्लॉट बुकिंग / Slot Booking</h2>
  <form id="bookingForm">
    <div class="form-group">
      <label>Select State Mandi</label>
      <select id="mandi_id" onchange="checkAvailability()" required>
        <option value="">-- Choose State Mandi --</option>
        {% for m in mandis %}
          <option value="{{ m.id }}">{{ m.state }} - {{ m.name }} ({{ m.center }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Crop / फसल</label>
      <select id="crop">
        <option value="Wheat">Wheat / गेहूँ</option>
        <option value="Rice">Rice / चावल</option>
        <option value="Potato">Potato / आलू</option>
        <option value="Maize">Maize / मक्का</option>
      </select>
    </div>

    <div class="form-group">
      <label>Quantity (kg)</label>
      <input type="number" id="quantity" required placeholder="Quantity in KG">
    </div>

    <div class="form-group">
      <label>Date / तारीख</label>
      <input type="date" id="date" onchange="checkAvailability()" required>
    </div>

    <div class="form-group">
      <label>Time Slot Availability</label>
      <div id="availabilityBadges" style="margin-bottom: 10px;">Select Mandi and Date to view availability</div>
      <select id="slot" required>
        <option value="08:00 - 10:00">08:00 - 10:00 AM</option>
        <option value="10:00 - 12:00">10:00 - 12:00 PM</option>
        <option value="12:00 - 02:00">12:00 - 02:00 PM</option>
        <option value="02:00 - 04:00">02:00 - 04:00 PM</option>
      </select>
    </div>

    <button type="submit">Confirm Booking</button>
  </form>
  <div id="bookingResult" style="margin-top: 15px;"></div>
</div>

<script>
async function checkAvailability() {
  const mandiId = document.getElementById("mandi_id").value;
  const date = document.getElementById("date").value;
  if (!mandiId || !date) return;

  const res = await fetch(`/api/availability?mandi_id=${mandiId}&date=${date}`);
  const data = await res.json();
  
  const container = document.getElementById("availabilityBadges");
  container.innerHTML = "";
  data.forEach(item => {
    container.innerHTML += `<span class="badge-${item.color}" style="margin-right:8px;">${item.slot}: ${item.remaining} left</span>`;
  });
}

document.getElementById("bookingForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = {
    mandi_id: document.getElementById("mandi_id").value,
    crop: document.getElementById("crop").value,
    quantity: document.getElementById("quantity").value,
    date: document.getElementById("date").value,
    slot: document.getElementById("slot").value
  };

  const response = await fetch("/book-slot", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });

  const res = await response.json();
  if (response.ok) {
    document.getElementById("bookingResult").innerHTML = `
      <div class="card" style="border-color: green;">
        <strong>Booking Successful!</strong><br>
        Token Number: #${res.token}<br>
        Mandi: ${res.mandi}<br>
        Slot: ${res.slot}
      </div>`;
  } else {
    document.getElementById("bookingResult").innerHTML = `<p style="color:red;">${res.error}</p>`;
  }
});
</script>
{% endblock %}
