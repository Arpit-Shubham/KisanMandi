{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
  <h2>Login / साइन इन</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div style="padding: 10px; margin-bottom: 10px; border-radius: 4px; background-color: #ffebee; color: #c62828;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('login_page') }}">
    <div class="form-group">
      <label>Mobile Number</label>
      <input type="tel" name="mobile" required placeholder="10-digit number">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit">Sign In</button>
  </form>
  <p style="margin-top:15px;">New User? <a href="{{ url_for('register_page') }}">Register Here</a></p>
</div>
{% endblock %}
