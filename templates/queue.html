{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>लाइव कतार की स्थिति (Live Queue)</h2>
  <p>Currently Serving Token: <strong id="current" style="font-size: 1.5rem; color: var(--primary);">-</strong></p>
  <p>Total Waiting: <strong id="total">-</strong></p>
</div>

<div id="queueContainer"></div>

<script>
let lastToken = null;

async function pollQueue() {
  const res = await fetch("/queue");
  const data = await res.json();

  if (lastToken !== null && lastToken !== data.current) {
    sendBrowserNotification("Kisan Mandi Update", `Now serving Token #${data.current}`);
  }
  lastToken = data.current;

  document.getElementById("current").textContent = data.current ? `#${data.current}` : "None";
  document.getElementById("total").textContent = data.total;

  const container = document.getElementById("queueContainer");
  container.innerHTML = "";

  data.queue.forEach(item => {
    container.innerHTML += `
      <div class="card">
        <strong>Token #${item.token} - ${item.name}</strong>
        <p>People Ahead: ${item.people_ahead}</p>
        <p>Estimated Wait: ${item.estimated_wait} mins</p>
      </div>`;
  });
}

pollQueue();
setInterval(pollQueue, 4000); // Live poll every 4s
</script>
{% endblock %}
