{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
  <h2>Register / पंजीकरण</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div style="padding: 10px; margin-bottom: 10px; border-radius: 4px; background-color: #ffebee; color: #c62828;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('register_page') }}">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" required placeholder="Farmer Name">
    </div>
    <div class="form-group">
      <label>Mobile Number</label>
      <input type="tel" name="mobile" required placeholder="10-digit number">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit">Register Account</button>
  </form>
</div>
{% endblock %}
