<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KisanMandi — Booking Tracking</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div>
          <strong>बुकिंग ट्रैकिंग</strong><br />
          <span class="subtitle">Booking Tracking</span>
        </div>
        <a class="back" href="{{ url_for('home_page') }}">←</a>
      </div>
    </header>
    <div id="bookingDetails">Loading...</div>

    <div class="container">
      <p>
        बुकिंग चुनें:
        <select id="bookingSelect" onchange="loadBooking(this.value)"></select>
      </p>
    </div>

    <script>
      async function loadBooking(token) {
        if (!token) {
          token = 1;
        }

        const response = await fetch(`/status/${token}`);

        const data = await response.json();

        if (data.error) {
          document.getElementById("bookingDetails").innerHTML =
            "Booking not found";

          return;
        }

        document.getElementById("bookingDetails").innerHTML = `

        <h2>#${data.token}</h2>

        <p>
            <strong>Name:</strong>
            ${data.name}
        </p>

        <p>
            <strong>Crop:</strong>
            ${data.crop}
        </p>

        <p>
            <strong>Quantity:</strong>
            ${data.quantity} kg
        </p>

        <p>
            <strong>Mandi:</strong>
            ${data.mandi}
        </p>

        <p>
            <strong>Date:</strong>
            ${data.date}
        </p>

        <p>
            <strong>Time:</strong>
            ${data.slot}
        </p>

        <p>
            <strong>Status:</strong>
            ${data.status}
        </p>

    `;

        const select = document.getElementById("bookingSelect");
        if (select.value != data.token) {
          select.value = data.token;
        }
      }

      async function loadBookingOptions() {
        const response = await fetch("/bookings");
        const bookingList = await response.json();

        const select = document.getElementById("bookingSelect");
        select.innerHTML = "";

        bookingList.forEach((b) => {
          const option = document.createElement("option");
          option.value = b.token;
          option.textContent =
            "#" + b.token + " - " + b.name + " (" + b.crop + ")";
          select.appendChild(option);
        });

        if (bookingList.length) {
          select.value = bookingList[bookingList.length - 1].token;
        }
      }

      async function init() {
        await loadBookingOptions();
        loadBooking(document.getElementById("bookingSelect").value);
      }

      init();
    </script>
  </body>
</html>
