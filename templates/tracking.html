{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>आपकी बुकिंग ट्रैकिंग</h2>
  <div class="form-group">
    <label>Select Booking</label>
    <select id="bookingSelect" onchange="renderDetails(this.value)"></select>
  </div>
  <div id="detailsCard"></div>
</div>

<script>
let bookingsData = [];

async function loadUserBookings() {
  const res = await fetch("/bookings");
  bookingsData = await res.json();
  const select = document.getElementById("bookingSelect");
  select.innerHTML = "";
  
  bookingsData.forEach(b => {
    select.innerHTML += `<option value="${b.id}">Token #${b.token} - ${b.crop} (${b.date})</option>`;
  });
  if (bookingsData.length > 0) renderDetails(bookingsData[0].id);
}

async function renderDetails(id) {
  const res = await fetch(`/status/${id}`);
  const data = await res.json();
  
  document.getElementById("detailsCard").innerHTML = `
    <div style="margin-top:15px; border-top: 1px solid #ccc; padding-top: 15px;">
      <p><strong>Token Number:</strong> #${data.token}</p>
      <p><strong>Name:</strong> ${data.name}</p>
      <p><strong>Crop / Quantity:</strong> ${data.crop} (${data.quantity} kg)</p>
      <p><strong>Mandi:</strong> ${data.mandi}</p>
      <p><strong>Slot:</strong> ${data.date} [${data.slot}]</p>
      <p><strong>Status:</strong> <span style="font-weight:bold; color:var(--primary);">${data.status}</span></p>
      <p><strong>Payment Status:</strong> ${data.payment_status}</p>
    </div>
  `;
}

loadUserBookings();
</script>
{% endblock %}
